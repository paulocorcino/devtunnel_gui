[package]
name = "devtunnel_gui"
version = "0.1.0"
edition = "2021"
description = "Desktop GUI (Windows tray) for managing Microsoft Dev Tunnels"

[dependencies]
# `unstable-winit-030` exposes BackendSelector's window-attributes hook, used to
# set the window/taskbar icon at creation time (winit ignores Slint's own icon
# property and defaults to a null class icon). See install_window_icon in main.rs.
slint = { version = "1.13", features = ["unstable-winit-030"] }
tray-icon = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
arboard = "3"
fluent-bundle = "0.15"
open = "5"
sys-locale = "0.3"
unic-langid = "0.9"
# Lightweight logging facade — always linked so `log::` macros compile in the
# default build too (they are no-ops until a logger is installed, which only the
# `hosting`/`spike` builds do via env_logger).
log = "0.4"

# Spike #2 (HITL): native hosting via SDK. Isolated behind the `spike` feature
# to avoid adding build weight to the GUI until the SDK-vs-fallback decision is settled.
tunnels = { git = "https://github.com/microsoft/dev-tunnels", features = ["connections", "vendored-openssl"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
env_logger = { version = "0.11", optional = true }
# Blocking HTTP client. Used by the startup update checker (GitHub Releases) in
# every build, and by the health probe in the `hosting` build. rustls avoids a
# native OpenSSL dependency, keeping the default build light.
ureq = { version = "2", default-features = false, features = ["tls"] }

[target.'cfg(windows)'.dependencies]
# Initial dark-mode detection: read the Windows "apps use light theme" setting.
# Also used for the HKCU Run-key auto-start toggle (issue #5).
winreg = "0.55"
# Windows toast for the re-login case only (issue #5).
tauri-winrt-notification = "0.7"
# Pure-Rust writer for Windows .lnk shortcuts — used to create the Start-menu
# entry when the app installs itself into %LOCALAPPDATA%\Programs. Avoids COM.
mslnk = "0.1"

[features]
spike = ["dep:tunnels", "dep:tokio", "dep:env_logger"]
# Integrated SDK hosting + health probe (issue #4). Kept gated so the default
# `cargo build` stays light (no vendored OpenSSL / heavy toolchain).
# env_logger is no longer needed here: the GUI installs its own capturing
# logger (src/logbuf.rs) in every build. The spike bin still uses env_logger.
hosting = ["dep:tunnels", "dep:tokio"]

[[bin]]
name = "devtunnel_gui"
path = "src/main.rs"

[[bin]]
name = "host_spike"
path = "src/bin/host_spike.rs"
required-features = ["spike"]

[[bin]]
name = "two_host_probe"
path = "src/bin/two_host_probe.rs"
required-features = ["spike"]

[build-dependencies]
slint-build = "1.13"

# Render + embed the executable/taskbar icon (see build.rs). Windows-only: the
# .ico is encoded with `ico` and embedded as a resource via `winresource`.
[target.'cfg(windows)'.build-dependencies]
ico = "0.3"
winresource = "0.1"

# Profiling build: release-grade optimization with full debug symbols so a
# sampler (samply) shows readable stacks and blocked-thread info. Build with:
#   cargo build --features hosting --profile profiling
# then:  samply record -- target/profiling/devtunnel_gui.exe
[profile.profiling]
inherits = "release"
debug = true
