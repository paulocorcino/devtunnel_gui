[package]
name = "devtunnel_gui"
version = "0.1.0"
edition = "2021"
description = "Desktop GUI (Windows tray) for managing Microsoft Dev Tunnels"

[dependencies]
slint = "1.13"
tray-icon = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
arboard = "3"
open = "5"

# Spike #2 (HITL): hospedagem nativa via SDK. Isolada atrás da feature `spike`
# para não pesar no build da GUI até a decisão SDK-vs-fallback estar tomada.
tunnels = { git = "https://github.com/microsoft/dev-tunnels", features = ["connections", "vendored-openssl"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
env_logger = { version = "0.11", optional = true }
log = { version = "0.4", optional = true }

[features]
spike = ["dep:tunnels", "dep:tokio", "dep:env_logger", "dep:log"]

[[bin]]
name = "devtunnel_gui"
path = "src/main.rs"

[[bin]]
name = "host_spike"
path = "src/bin/host_spike.rs"
required-features = ["spike"]

[build-dependencies]
slint-build = "1.13"
