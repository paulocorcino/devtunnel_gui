[package]
name = "devtunnel_gui"
version = "0.1.0"
edition = "2021"
description = "Desktop GUI (Windows tray) for managing Microsoft Dev Tunnels"

[dependencies]
slint = "1.13"
tray-icon = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
arboard = "3"
open = "5"

[build-dependencies]
slint-build = "1.13"
