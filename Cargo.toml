[package]
name = "devtunnel_gui"
version = "0.1.0"
edition = "2021"
description = "Desktop GUI (Windows tray) for managing Microsoft Dev Tunnels"

[dependencies]
slint = "1.13"
tray-icon = "0.19"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
arboard = "3"
fluent-bundle = "0.15"
open = "5"
sys-locale = "0.3"
unic-langid = "0.9"

# Spike #2 (HITL): native hosting via SDK. Isolated behind the `spike` feature
# to avoid adding build weight to the GUI until the SDK-vs-fallback decision is settled.
tunnels = { git = "https://github.com/microsoft/dev-tunnels", features = ["connections", "vendored-openssl"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
env_logger = { version = "0.11", optional = true }
log = { version = "0.4", optional = true }
# Blocking HTTP client for the health probe (issue #4). rustls avoids a native
# OpenSSL dependency for the probe itself. Optional: only pulled by `hosting`.
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }

[features]
spike = ["dep:tunnels", "dep:tokio", "dep:env_logger", "dep:log"]
# Integrated SDK hosting + health probe (issue #4). Kept gated so the default
# `cargo build` stays light (no vendored OpenSSL / heavy toolchain).
hosting = ["dep:tunnels", "dep:tokio", "dep:ureq", "dep:log"]

[[bin]]
name = "devtunnel_gui"
path = "src/main.rs"

[[bin]]
name = "host_spike"
path = "src/bin/host_spike.rs"
required-features = ["spike"]

[build-dependencies]
slint-build = "1.13"
